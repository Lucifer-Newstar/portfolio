sonar.projectBaseDir=.
sonar.sourceEncoding=UTF-8

# Analyze the active frontend and Lambda source code in this mono-repo.
sonar.sources=frontend/src,backend/lambdas

# Limit analysis to actual application code and skip generated, backup, and static asset paths.
sonar.inclusions=frontend/src/**,backend/lambdas/**/src/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.aws-sam/**,**/*.test.*,**/*.spec.*,frontend/public/**,frontend/src/assets/**,backend/aws-backups/**,backend/api-gateway/**,backend/dynamodb/**,backend/export-aws-backup.cmd,backend/lambdas/**/template.yaml,public/**,src/**,docs/**,scripts/**

# Mark tests explicitly if they are added later and follow common naming.
sonar.tests=frontend/src,backend/lambdas
sonar.test.inclusions=**/*.test.*,**/*.spec.*
